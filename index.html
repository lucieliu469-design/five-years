g:11px 13px;color:#775b45;line-height:1.6}.auth{position:fixed;inset:0;z-index:200;display:grid;place-items:center;padding:18px;background:linear-gradient(145deg,#fff8f0,#f5e8d8);overflow:auto}.auth-card{width:min(100%,460px);background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:23px;box-shadow:0 25px 70px rgba(108,78,52,.14)}.auth-card h1{font-family:Georgia,serif;margin:18px 0 7px}.auth-card p{color:var(--muted);line-height:1.6}.auth-grid{display:grid;gap:11px}.auth-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.auth-msg{min-height:21px;color:var(--muted);font-size:.88rem}.status{font-size:.84rem;color:var(--muted);margin-bottom:10px}.footer{text-align:center;color:#9a7c65;font-size:.82rem;margin-top:28px}.file-input{display:none}@media(min-width:768px){:root{--pad:20px;--gap:20px}.year-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.attachments{grid-template-columns:repeat(2,minmax(0,1fr))}.answers{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(min-width:1024px){:root{--pad:24px;--gap:24px}.year-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.attachments{grid-template-columns:repeat(3,minmax(0,1fr))}.answers{grid-template-columns:repeat(5,minmax(0,1fr))}}@media(max-width:767px){nav{display:none}.menu{display:inline-flex}.email{display:none}.head{align-items:flex-start;flex-direction:column}.controls{width:100%}.controls .btn,.controls select,.controls input{flex:1 1 auto}.card{padding:14px}.hero{padding-top:20px}.auth-actions{grid-template-columns:1fr}.brand .long{display:none}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

<main class="wrap"><section class="hero"><h1>把同一天，写成五年的时间切片。</h1><p>2026–2030 · 同一账号跨设备同步 · 文字内容保留本地缓存。</p></section><div id="status" class="status"></div>

<section id="page-settings" class="page"><div class="head"><h2>设置与同步</h2></div><div class="card"><div class="notice">日记和问卷以 Supabase 云端为跨设备同步源，并保留当前浏览器的文字缓存。附件上传和跨设备预览需要联网。</div><div class="controls" style="margin-top:14px"><button id="syncBtn" class="btn">立即同步</button><button id="exportBtn" class="btn secondary">导出文字备份</button><label for="importInput" class="btn secondary" style="margin:0">导入备份</label><input id="importInput" class="file-input" type="file" accept="application/json"><button id="logoutBtn" class="btn ghost">退出登录</button></div></div></section><div class="footer">Five Years Journal · 2026–2030</div></main>

const BUCKET='journal-attachments',YEARS=[2026,2027,2028,2029,2030],$=id=>document.getElementById(id),WEEK=['日','一','二','三','四','五','六'];
let sb,user=null,state={diaries:[],answers:[],questions:[],attachments:[]},compareMD={m:new Date().getMonth()+1,d:new Date().getDate()},proustCompare=false;
const key=()=>`fyj-cache-${user?.id||'none'}`;const saveCache=()=>user&&localStorage.setItem(key(),JSON.stringify(state));function loadCache(){try{state=JSON.parse(localStorage.getItem(key()))||state}catch{}}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function clean(html=''){const t=document.createElement('template');t.innerHTML=html;t.content.querySelectorAll('script,iframe,object,embed,style,link').forEach(x=>x.remove());t.content.querySelectorAll('*').forEach(el=>[...el.attributes].forEach(a=>{if(a.name.startsWith('on'))el.removeAttribute(a.name);if(a.name==='style'&&!/^(color:\s*(rgb\([^)]*\)|#[0-9a-fA-F]{3,6}|black|blue|purple)\s*;?)+$/.test(a.value))el.removeAttribute('style')}));return t.innerHTML}function iso(y,m,d){return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`}function parts(date){const [y,m,d]=date.split('-').map(Number);return{y,m,d}}function today(){const n=new Date(),y=Math.min(2030,Math.max(2026,n.getFullYear()));return iso(y,n.getMonth()+1,n.getDate())}function diary(date){return state.diaries.find(x=>x.entry_date===date)}function answers(y,q){return state.answers.find(x=>x.year===y&&x.question_id===q)}function atts(date){return state.attachments.filter(x=>x.entry_date===date)}

async function signed(path){if(!navigator.onLine)return null;const {data}=await sb.storage.from(BUCKET).createSignedUrl(path,3600);return data?.signedUrl||null}async function renderAtts(el,date,editable=false){el.innerHTML='';for(const a of atts(date)){const url=await signed(a.storage_path),c=document.createElement('div');c.className='att';let media='<div class="muted">离线时附件不可预览</div>';if(url){if((a.mime_type||'').startsWith('image/'))media=`<img src="${esc(url)}" alt="${esc(a.file_name)}">`;else if((a.mime_type||'').startsWith('video/'))media=`<video src="${esc(url)}" controls></video>`;else if((a.mime_type||'').startsWith('audio/'))media=`<audio src="${esc(url)}" controls></audio>`;else media=`<a class="btn secondary" href="${esc(url)}" target="_blank">打开 PDF</a>`}c.innerHTML=`${media}<div class="file-row"><span>${esc(a.file_name)}</span>${editable?`<button class="icon del-att" data-id="${a.id}">×</button>`:''}</div>`;el.appendChild(c)}if(editable)el.querySelectorAll('.del-att').forEach(b=>b.onclick=()=>deleteAtt(b.dataset.id,date))}
async function deleteAtt(id,date){const a=state.attachments.find(x=>x.id===id);if(!a||!navigator.onLine)return;await sb.storage.from(BUCKET).remove([a.storage_path]);await sb.from('attachments').delete().eq('id',id);state.attachments=state.attachments.filter(x=>x.id!==id);saveCache();openEdit(date)}
async function renderCompare(){const m=compareMD.m,d=compareMD.d;$('compareTitle').textContent=`${m}月${d}日 · 五年对照`;$('compareStack').innerHTML='';for(const y of YEARS){const date=iso(y,m,d),e=diary(date),c=document.createElement('div');c.className='entry';c.innerHTML=e?`<h3>${y}</h3><div class="badges">${e.weather?`<span class="badge">天气 · ${esc(e.weather)}</span>`:''}${e.mood?`<span class="badge">心情 · ${esc(e.mood)}</span>`:''}</div><h4>${esc(e.title||'无标题')}</h4><div style="line-height:1.75;overflow-wrap:anywhere">${clean(e.content||'')}</div><div class="attachments"></div><div class="controls" style="margin-top:10px"><button class="btn secondary edit" data-date="${date}">编辑</button></div>`:`<h3>${y}</h3><p class="muted">尚未记录。</p><button class="btn secondary edit" data-date="${date}">写下这一天</button>`;$('compareStack').appendChild(c);if(e)renderAtts(c.querySelector('.attachments'),date,false)}$('compareStack').querySelectorAll('.edit').forEach(b=>b.onclick=()=>openEdit(b.dataset.date))}
function renderProust(){const y=+$('proustYear').value,body=$('proustBody');if(!state.questions.length){body.innerHTML='<div class="notice">问卷题目尚未同步，请联网后点击“立即同步”。</div>';return}if(!proustCompare){body.innerHTML='<div class="questions">'+state.questions.map(q=>`<div class="card q"><h3>${String(q.display_order).padStart(2,'0')}. ${esc(q.question_cn)}</h3><p>${esc(q.question_en)}</p><textarea data-q="${q.id}" placeholder="写下 ${y} 年的回答……">${esc(answers(y,q.id)?.answer||'')}</textarea></div>`).join('')+'</div>';let timers=new Map();body.querySelectorAll('textarea').forEach(t=>t.oninput=()=>{clearTimeout(timers.get(t));timers.set(t,setTimeout(()=>saveAnswer(y,+t.dataset.q,t.value),600))})}else body.innerHTML=state.questions.map(q=>`<div class="card q" style="margin-bottom:14px"><h3>${String(q.display_order).padStart(2,'0')}. ${esc(q.question_cn)}</h3><p>${esc(q.question_en)}</p><div class="answers">${YEARS.map(yy=>`<div class="answer"><strong>${yy}</strong><div>${esc(answers(yy,q.id)?.answer||'尚未回答')}</div></div>`).join('')}</div></div>`).join('')}
function renderSearch(){const q=$('searchInput').value.trim().toLowerCase(),arr=state.diaries.filter(e=>!q||(`${e.title||''} ${(e.content||'').replace(/<[^>]*>/g,' ')}`).toLowerCase().includes(q)).sort((a,b)=>b.entry_date.localeCompare(a.entry_date)).slice(0,40);$('searchResults').innerHTML=arr.length?arr.map(e=>`<div class="search-item"><button data-date="${e.entry_date}"><strong>${e.entry_date}</strong> · ${esc(e.title||'无标题')}<div class="muted" style="margin-top:5px">${esc((e.content||'').replace(/<[^>]*>/g,' ').slice(0,100))}</div></button></div>`).join(''):'<p class="muted">暂无结果。</p>';$('searchResults').querySelectorAll('button').forEach(b=>b.onclick=()=>{const p=parts(b.dataset.date);compareMD={m:p.m,d:p.d};$('compareDate').value=b.dataset.date;go('compare')})}
function renderCurrent(){if(!$('authGate').classList.contains('hidden'))return;const p=document.querySelector('.page.active')?.id;if(p==='page-year')renderYear();else if(p==='page-month')renderMonth();else if(p==='page-compare')renderCompare();else if(p==='page-proust')renderProust();else if(p==='page-search')renderSearch()}
function initControls(){for(const y of YEARS){['yearSelect','monthYear','proustYear'].forEach(id=>$(id).insertAdjacentHTML('beforeend',`<option value="${y}">${y}</option>`))}for(let m=1;m<=12;m++)$('monthSelect').insertAdjacentHTML('beforeend',`<option value="${m}">${m}月</option>`);const t=parts(today());$('yearSelect').value=t.y;$('monthYear').value=t.y;$('monthSelect').value=t.m;$('proustYear').value=t.y;$('compareDate').value=today();compareMD={m:t.m,d:t.d};$('yearSelect').onchange=renderYear;$('monthYear').onchange=renderMonth;$('monthSelect').onchange=renderMonth;$('prevMonth').onclick=()=>moveMonth(-1);$('nextMonth').onclick=()=>moveMonth(1);$('compareDate').onchange=()=>{const p=parts($('compareDate').value);compareMD={m:p.m,d:p.d};renderCompare()};$('proustYear').onchange=renderProust;$('proustMode').onclick=()=>{proustCompare=!proustCompare;$('proustMode').textContent=proustCompare?'切换：按年份填写':'切换：同题五年对照';renderProust()};$('searchInput').oninput=renderSearch;$('syncBtn').onclick=()=>pull();$('logoutBtn').onclick=()=>sb.auth.signOut();$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:3,exportedAt:new Date().toISOString(),diaries:state.diaries,proust:state.answers},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=`five-years-journal-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(u)};$('importInput').onchange=importBackup}
function moveMonth(delta){let y=+$('monthYear').value,m=+$('monthSelect').value+delta;if(m<1){m=12;y--}if(m>12){m=1;y++}y=Math.min(2030,Math.max(2026,y));$('monthYear').value=y;$('monthSelect').value=m;renderMonth()}
$('attachmentInput').onchange=async e=>{const date=e.target.dataset.date,files=[...e.target.files];e.target.value='';if(!files.length||!navigator.onLine)return;let d=diary(date);if(!d)d=await saveDiary({entry_date:date,title:'',weather:'',mood:'',content:''});for(const f of files){const id=crypto.randomUUID(),path=`${user.id}/${date}/${id}-${f.name.replace(/[^a-zA-Z0-9._-]+/g,'_')}`;syncState('busy','上传附件…');const up=await sb.storage.from(BUCKET).upload(path,f,{contentType:f.type||'application/octet-stream'});if(up.error){alert(up.error.message);continue}const ins=await sb.from('attachments').insert({user_id:user.id,diary_id:d.id,entry_date:date,storage_path:path,file_name:f.name,mime_type:f.type||'application/octet-stream',file_size:f.size}).select('*').single();if(ins.error){alert(ins.error.message);continue}state.attachments.push(ins.data)}saveCache();syncState('on','已同步');openEdit(date)};
async function importBackup(e){const f=e.target.files[0];e.target.value='';if(!f)return;try{const x=JSON.parse(await f.text());for(const d of x.diaries||[])await saveDiary({entry_date:d.entry_date||d.date,title:d.title,weather:d.weather,mood:d.mood,content:d.content});for(const a of x.proust||[])await saveAnswer(+a.year,+(a.question_id||a.q),a.answer||'');await pull();alert('导入完成')}catch(err){alert('导入失败：'+err.message)}}
async function enter(u){user=u;$('userEmail').textContent=u.email||'';$('authGate').classList.add('hidden');loadCache();renderCurrent();await pull();flushPending()}async function leave(){user=null;$('authGate').classList.remove('hidden');state={diaries:[],answers:[],questions:[],attachments:[]}}
$('loginBtn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('authEmail').value.trim(),password:$('authPassword').value});$('authMsg').textContent=error?error.message:''};$('signupBtn').onclick=async()=>{const email=$('authEmail').value.trim(),password=$('authPassword').value;if(password.length<6){$('authMsg').textContent='密码至少 6 位';return}const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin}});$('authMsg').textContent=error?error.message:(data.session?'账号已创建并登录。':'账号已创建，请检查邮箱并完成验证。')};$('resetBtn').onclick=async()=>{const email=$('authEmail').value.trim();if(!email){$('authMsg').textContent='请先填写邮箱';return}const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});$('authMsg').textContent=error?error.message:'重置邮件已发送。'};
window.addEventListener('online',()=>{network();flushPending()});window.addEventListener('offline',network);
(async()=>{initControls();network();if(!window.supabase){$('authMsg').textContent='Supabase 客户端加载失败，请检查网络后刷新。';return}sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});sb.auth.onAuthStateChange(async(event,session)=>{if(event==='PASSWORD_RECOVERY'){const p=prompt('请输入新密码（至少 6 位）');if(p?.length>=6){const {error}=await sb.auth.updateUser({password:p});alert(error?error.message:'密码已更新')}}if(session?.user&&user?.id!==session.user.id)await enter(session.user);if(!session?.user&&user)await leave()});const {data}=await sb.auth.getSession();if(data.session?.user)await enter(data.session.user)})();
</script>
</body></html>
